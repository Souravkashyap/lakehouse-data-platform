version: 2

models:
  - name: silver_lending_loan_events
    description: Append-only history of loan events, one row per event_id (dedup window 8 days). Design section 8.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: amount_paise
        description: Integer paise (NUMBER(38,0)); never float.
        data_tests:
          - not_null:
              config:
                where: "event_type in ('LoanDisbursed', 'EmiPaid')"

  - name: silver_lending_loans_current
    description: Current state per loan, protected by the ordering guard (highest source sequence wins). Design section 8.
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'CLOSED', 'FORECLOSED', 'CANCELLED', 'WRITTEN_OFF']

  - name: silver_lending_installments
    description: One row per loan and installment, from the loan's guarded latest state. A touched loan has all its installments replaced. Design section 8.
    columns:
      - name: loan_id
        data_tests: [not_null]
      - name: installment_no
        data_tests: [not_null]
      - name: due_date
        data_tests: [not_null]
      - name: emi_due_paise
        data_tests: [not_null]

  - name: silver_lending_applications_current
    description: Current state per loan application, protected by the same ordering guard (highest source sequence wins). Design section 8.
    columns:
      - name: application_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['SUBMITTED', 'APPROVED', 'REJECTED', 'ACCEPTED', 'DISBURSED', 'CANCELLED', 'EXPIRED']

# Ordering-guard tests: test 1 in docs/test-plan.md.
unit_tests:
  - name: late_older_event_never_overwrites_newer_state
    description: A late event with a lower sequence must not regress state; only the new loan L2 is written.
    model: silver_lending_loans_current
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('silver_lending_loan_events')
        rows:
          - {loan_id: L1, sequence: 6, event_type: EmiPaid, event_time_utc: '2026-10-03 10:00:00', loaded_at: '2026-10-03 11:00:00', customer_id: C1, lender_id: NBFC-017, state_json: '{"status": "ACTIVE", "product_code": "PERSONAL_LOAN"}'}
          - {loan_id: L2, sequence: 1, event_type: EmiPaid, event_time_utc: '2026-10-03 10:00:00', loaded_at: '2026-10-03 11:00:00', customer_id: C1, lender_id: NBFC-017, state_json: '{"status": "ACTIVE", "product_code": "PERSONAL_LOAN"}'}
      - input: this
        rows:
          - {loan_id: L1, sequence: 7, status: ACTIVE, last_loaded_at: '2026-10-03 10:00:00'}
    expect:
      rows:
        - {loan_id: L2, sequence: 1, status: ACTIVE}

  - name: newer_event_replaces_state
    description: A higher sequence replaces the stored state.
    model: silver_lending_loans_current
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('silver_lending_loan_events')
        rows:
          - {loan_id: L1, sequence: 8, event_type: EmiPaid, event_time_utc: '2026-10-03 10:00:00', loaded_at: '2026-10-03 11:00:00', customer_id: C1, lender_id: NBFC-017, state_json: '{"status": "CLOSED", "product_code": "PERSONAL_LOAN"}'}
      - input: this
        rows:
          - {loan_id: L1, sequence: 7, status: ACTIVE, last_loaded_at: '2026-10-03 10:00:00'}
    expect:
      rows:
        - {loan_id: L1, sequence: 8, status: CLOSED}

  - name: duplicates_and_out_of_order_in_one_batch_apply_once
    description: Sequences 9, 8, 9 (duplicate) in one batch yield a single row at sequence 9.
    model: silver_lending_loans_current
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('silver_lending_loan_events')
        rows:
          - {loan_id: L1, sequence: 9, event_type: EmiPaid, event_time_utc: '2026-10-03 10:00:00', loaded_at: '2026-10-03 11:00:00', customer_id: C1, lender_id: NBFC-017, state_json: '{"status": "CLOSED", "product_code": "PERSONAL_LOAN"}'}
          - {loan_id: L1, sequence: 8, event_type: EmiPaid, event_time_utc: '2026-10-03 10:00:00', loaded_at: '2026-10-03 11:00:00', customer_id: C1, lender_id: NBFC-017, state_json: '{"status": "ACTIVE", "product_code": "PERSONAL_LOAN"}'}
          - {loan_id: L1, sequence: 9, event_type: EmiPaid, event_time_utc: '2026-10-03 10:00:00', loaded_at: '2026-10-03 11:00:00', customer_id: C1, lender_id: NBFC-017, state_json: '{"status": "CLOSED", "product_code": "PERSONAL_LOAN"}'}
      - input: this
        rows:
          - {loan_id: L1, sequence: 7, status: ACTIVE, last_loaded_at: '2026-10-03 10:00:00'}
    expect:
      rows:
        - {loan_id: L1, sequence: 9, status: CLOSED}
